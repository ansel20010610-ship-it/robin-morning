<link rel="stylesheet" href="assets/style.css">
<script>
  try {
    var t = localStorage.getItem("rm.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    var f = localStorage.getItem("rm.fs"); if (f) document.documentElement.style.setProperty("--fs", f);
  } catch (e) {}
  // 紙放一天: the light paper's tones, fresh and a day old, and how old the paper is at a minute of the day. Here, ahead
  // of everything, so that opening the app in the evening shows the evening's paper and status bar from the first frame
  // (知更鳥正在送報…… included), not the morning's for a moment; by the clock alone (07:30). masthead.js reads them from
  // here (window.paperDay) and puts them to the front page's paper. A change here changes this script's sha256 in the
  // Content-Security-Policy above.
  window.paperDay = (function () {
    var AGED = { "--paper": ["#F5F0E6", "#F4EBD6"], "--paper-2": ["#EDE5D5", "#ECE2C8"], "--paper-3": ["#E3D8C2", "#E3D6B8"] };
    var mix = function (a, b, t) {
      var s = "#";
      for (var i = 1; i < 7; i += 2) s += Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t).toString(16).padStart(2, "0");
      return s;
    };
    // m: minutes since midnight, Taiwan time; out: the day's paper is on the front page; start: the minute it comes out.
    // 0 as it comes, rising along a smoothstep (hardly at all in the morning) to 1 at 22:00, and 1 until the next paper.
    var age = function (m, out, start) {
      if (start == null) start = 450;
      if (out == null) out = m >= start;
      if (!out) return 1;
      var a = Math.min(1, Math.max(0, (m - start) / (1320 - start)));
      return a * a * (3 - 2 * a);
    };
    var tone = function (a) { return mix(AGED["--paper"][0], AGED["--paper"][1], a); };
    var tint = function (a) {
      var s = document.documentElement.style;
      s.setProperty("--age", a.toFixed(3));
      for (var k in AGED) s.setProperty(k + "-aged", mix(AGED[k][0], AGED[k][1], a));
    };
    try {
      var d = new Date(Date.now() + 288e5), a = age(d.getUTCHours() * 60 + d.getUTCMinutes());
      tint(a);
      var bar = document.querySelector('meta[name="theme-color"][media*="light"]'); if (bar) bar.content = tone(a);
    } catch (e) {}
    return { age: age, tone: tone, tint: tint };
  })();
</script>
<script type="module" src="assets/app.js"></script>
</head>
<body>

  </div>
</div>
