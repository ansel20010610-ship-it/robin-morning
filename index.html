<link rel="stylesheet" href="assets/style.css">
<style>
/* The courier: while app.js boots, the robin flies the paper across the page (assets/style.css paints the emblem's
   parts; the words keep their shimmer). Under reduced motion it waits in the middle. */
.loading .flight { position: relative; height: 64px; margin: 0 0 6px; }
.loading p { margin: 0; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .loading p { background: linear-gradient(100deg, var(--muted) 40%, var(--gold) 50%, var(--muted) 60%) 100% 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 1.6s linear infinite; } }
.loading .courier { position: absolute; top: 0; left: -64px; width: 60px; height: 60px; animation: courier 3.6s linear infinite, bob 1.1s ease-in-out infinite; }
.loading .courier .e-wing { transform-origin: 31px 33px; animation: flap .32s ease-in-out infinite alternate; }
.loading .courier .post { transform-origin: 47px 45px; animation: swing 1.1s ease-in-out infinite; }
@keyframes courier { to { left: 100%; } }
@keyframes bob { 50% { transform: translateY(-7px) rotate(-5deg); } }
@keyframes flap { to { transform: rotate(-24deg); } }
@keyframes swing { 50% { transform: rotate(-18deg) translateY(2px); } }
@media (prefers-reduced-motion: reduce) { .loading .courier, .loading .courier .e-wing, .loading .courier .post { animation: none; } .loading .courier { left: calc(50% - 30px); } }
</style>
<script>
  try {
    var t = localStorage.getItem("rm.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    var f = localStorage.getItem("rm.fs"); if (f) document.documentElement.style.setProperty("--fs", f);
  } catch (e) {}
</script>
