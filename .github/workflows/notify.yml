name: Issue notification

# 07:30 Taiwan time: tell the reader's phone that today's issue is out (Web Push through the phone's own push
# service; no AI, no paid service). See scripts/push.py. GitHub's schedules start hours late or not at all (both
# morning crons ran after 09:50 on 2026-11-08), so the reliable path is wire.yml's half-hour relay: at 07:00 it starts a
# run with mode=morning, which waits for 07:30:20 and for the live site exactly as a scheduled run does; the two
# morning crons stay as backup, and whichever run is first sends — the others see it (the dedup step) and stop. The
# same for the noon (12:30) and evening (21:00) reminders: the relay starts mode=noon at 12:00 and mode=evening at
# 21:00, the crons are backup, and push.py keeps each to its own window.
# Adding a device to state/push/devices.json sends that device a test notification. A push that finishes a 週日補刊
# (content/late.json, scripts/late.py) sends that issue's notification; one that gives it up sends the apology.
# Touching state/push/ping (any change) sends today's notice at once, so the owner can see the day's wording on the
# phone without waiting for 07:30. fill.yml starts a mode=filled run after a fill between 07:30 and 11:00, so a
# reader told 「今天少一欄」 hears that the paper is whole. watch.yml starts a mode=alert run when the morning's check finds
# something wrong (or fails on the way): one line to the owner's phone, once a day at most, that says only that
# something is off — a GitHub issue is mail he may never see, and nothing else here reaches him (push.py alert).
on:
  schedule:
    - cron: "50 22 * * *"   # 06:50 Taiwan: backup for the relay's 07:00 morning run
    - cron: "12 23 * * *"   # 07:12 Taiwan: second backup
    - cron: "30 4 * * *"    # 12:30 Taiwan: backup for the noon reminder (push.py remind --which noon; the phone drops it when the issue is read, push.py when the issue is held)
    - cron: "0 13 * * *"    # 21:00 Taiwan: backup for the evening reminder (push.py remind --which evening)
  push:
    branches: [main]
    paths: ["state/push/devices.json", "content/late.json", "state/push/ping"]
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 測試通知；issue = 立刻發今天的出刊通知；remind = 立刻發提醒；morning / noon / evening = 接力（wire.yml）用：等到 07:30 / 12:30 / 21:00 再發；filled = 補位（fill.yml）用：等補齊的刊期上線再發；alert = 監看（watch.yml）用：出刊有狀況，一天最多一則"
        type: choice
        options: [test, issue, remind, morning, noon, evening, filled, alert]
        default: test

permissions:
  contents: write
  actions: write

# GitHub keeps one pending run per group and cancels an older pending one. The morning runs (two crons and the relay's
# mode=morning) share notify-issue, so at most one waits for 07:30 at a time and none is lost; the reminders share
# notify-remind; a test or a manual run is in notify-adhoc and can never cancel a scheduled one (or the other way round);
# the watch's alert has a group to itself for the same reason.
concurrency:
  group: notify-${{ (github.event_name == 'schedule' && (github.event.schedule == '50 22 * * *' || github.event.schedule == '12 23 * * *') || inputs.mode == 'morning') && 'issue' || (github.event_name == 'schedule' || inputs.mode == 'noon' || inputs.mode == 'evening') && 'remind' || inputs.mode == 'alert' && 'alert' || 'adhoc' }}
  cancel-in-progress: false

jobs:
  notify:
    # The job's name carries which notice this run is (the cron that fired, or the dispatch mode): the dedup step reads
    # the names of today's successful runs to know whether this notice already went out, whatever started that run.
    name: notify ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name == 'workflow_dispatch' && inputs.mode || 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Which notice?
        id: kind
        # by the cron that fired or the dispatch mode, never by the clock: GitHub ran the 07:12 schedule at 10:26 on
        # 2026-11-08, and a morning run that starts after noon must still be the issue notice (push.py then decides
        # whether it is too late, and fails the run if it is)
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            case "${{ github.event.schedule }}" in
              "50 22 * * *"|"12 23 * * *") echo "kind=issue" >> "$GITHUB_OUTPUT" ;;
              "30 4 * * *") echo "kind=noon" >> "$GITHUB_OUTPUT" ;;
              *) echo "kind=evening" >> "$GITHUB_OUTPUT" ;;
            esac
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
            case "${{ inputs.mode }}" in
              morning) echo "kind=issue" >> "$GITHUB_OUTPUT" ;;
              *) echo "kind=${{ inputs.mode }}" >> "$GITHUB_OUTPUT" ;;
            esac
          else echo "kind=push" >> "$GITHUB_OUTPUT"; fi
      - name: Already sent today?
        id: dedup
        # the relay's run and the backup crons must never both send: count today's earlier successful runs of the same
        # notice, by job name, whichever event started them (a manual mode=issue or test is not counted and not deduped)
        if: github.event_name == 'schedule' || inputs.mode == 'morning' || inputs.mode == 'noon' || inputs.mode == 'evening' || inputs.mode == 'alert'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ steps.kind.outputs.kind }}" in
            issue)   PAT='^notify (50 22 \* \* \*|12 23 \* \* \*|morning)$'; FROM=06:00 ;;
            noon)    PAT='^notify (30 4 \* \* \*|noon)$'; FROM=11:30 ;;
            evening) PAT='^notify (0 13 \* \* \*|evening)$'; FROM=20:00 ;;
            alert)   PAT='^notify alert$'; FROM=00:00 ;;   # one a day, however many checks found something
            *)       PAT='^$'; FROM=00:00 ;;
          esac
          # count only runs started near this notice's own hour, not since midnight: yesterday's 21:00 cron that GitHub
          # started after midnight ends green outside its window without sending (push.py), and it must not pass for
          # tonight's reminder (audit c27)
          SINCE=$(date -u -d "$(TZ=Asia/Taipei date +%F) $FROM +0800" +%FT%TZ)
          # if the queries fail, send anyway: a rare duplicate (same tag, so it replaces the first) beats silence
          N=0
          for ID in $(gh run list --workflow notify.yml --status success --created ">=$SINCE" --limit 50 \
                        --json databaseId --jq '.[] | select(.databaseId != ${{ github.run_id }}) | .databaseId' 2>/dev/null); do
            if gh run view "$ID" --json jobs --jq '.jobs[].name' 2>/dev/null | grep -Eq "$PAT"; then N=$(( N + 1 )); fi
          done
          echo "earlier successful runs of this notice today: $N"
          if [ "$N" -gt 0 ]; then echo "sent=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Install pywebpush
        if: steps.dedup.outputs.sent != 'yes'
        run: python3 -m venv /tmp/push && /tmp/push/bin/pip install -q pywebpush==2.1.2
      - name: Send
        id: send
        if: steps.dedup.outputs.sent != 'yes'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          case "${{ steps.kind.outputs.kind }}" in
            # the morning notice waits for 07:30:20 and for the live site (push.py), unless the owner asked for it now
            issue) if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.mode }}" = morning ]; then /tmp/push/bin/python scripts/push.py issue; else /tmp/push/bin/python scripts/push.py issue --now; fi ;;
            # fill.yml after a fill: waits for the filled paper on the site and never sends 「少一欄」 again (audit c28)
            filled) /tmp/push/bin/python scripts/push.py issue --now --after-fill ;;
            noon) /tmp/push/bin/python scripts/push.py remind --which noon ;;
            evening) /tmp/push/bin/python scripts/push.py remind --which evening ;;
            remind) /tmp/push/bin/python scripts/push.py remind ;;
            test) /tmp/push/bin/python scripts/push.py test ;;
            alert) /tmp/push/bin/python scripts/push.py alert ;;
            push)
              BEFORE="${{ github.event.before }}"
              git fetch -q --depth=1 origin "$BEFORE" || true
              CHANGED=$(git diff --name-only "$BEFORE" HEAD -- state/push/devices.json content/late.json state/push/ping 2>/dev/null) \
                || CHANGED="state/push/devices.json content/late.json"
              R=0
              case "$CHANGED" in *devices.json*) /tmp/push/bin/python scripts/push.py test --new-since "$BEFORE" || R=1 ;; esac
              case "$CHANGED" in *late.json*) /tmp/push/bin/python scripts/push.py late --before "$BEFORE" || R=1 ;; esac
              # the ping file's last line says which notice to try: "remind" for the nudge, anything else the morning one
              case "$CHANGED" in *push/ping*)
                if tail -n 1 state/push/ping | grep -q '^remind'; then /tmp/push/bin/python scripts/push.py remind || R=1
                else /tmp/push/bin/python scripts/push.py issue --now || R=1; fi ;;
              esac
              exit $R ;;
          esac
      - name: Sent
        # The record that this run reached a device (push.py writes sent=yes only then). A green run is not that record:
        # on 2026-11-03 the morning run ended green having sent nothing, the backup took it for sent, and the day had no
        # notice and no word about it. watch.yml looks for this step among the morning's runs.
        if: always() && steps.send.outputs.sent == 'yes'
        run: echo "送到了至少一台裝置"
      - name: Drop devices that no longer take notifications
        if: always() && steps.dedup.outputs.sent != 'yes'
        # the run's success must mean "sent" (the next run's dedup counts on it), so a failed cleanup only warns
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$(git status --porcelain state/push)" ] && exit 0
          git config user.name "robin-morning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/push
          git commit -m "出刊通知：移除已失效的裝置"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push origin HEAD:main; then
              # pushes made with GITHUB_TOKEN do not trigger other workflows; redeploy so the settings page shows the change
              gh workflow run publish.yml --ref main
              exit 0
            fi
            sleep 5
          done
          echo "::error::移除失效裝置的推送三次都失敗"
          exit 1
