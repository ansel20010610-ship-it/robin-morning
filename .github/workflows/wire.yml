name: Wire (外電)

# Keeps the front page's 外電 bar fresh: on the hour, every hour, it starts publish.yml (hourly=true), whose build reads
# the wires (scripts/wire.py) and stamps them with the hour itself (the owner, 2026-11-07: 更新時間改成整點).
# GitHub's scheduler is not to be relied on for this (2026-11-07: the hourly cron in publish.yml never fired in four
# hours, and other schedules ran up to seven hours late), so the hours are kept by a relay instead: one run stays up,
# starting a deploy at each of the next four full hours, and at ten to the next one starts the next run of itself.
# The relay is started by a push of this file, by hand (workflow_dispatch), or by the cron below whenever GitHub does
# get round to it — so a broken relay mends itself. The concurrency group keeps it to one run and at most one waiting.
on:
  push:
    branches: [main]
    paths: [".github/workflows/wire.yml"]
  schedule:
    - cron: "50 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: wire-relay-hourly
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # at most 60 + 3 x 60 + 50 minutes of waiting
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: A deploy on each of the next four full hours
        run: |
          for i in 1 2 3 4; do
            sleep $(( 3600 - $(date +%s) % 3600 ))   # to the next :00
            gh workflow run publish.yml --ref main -f hourly=true || echo "::warning::could not start publish.yml (hour $i)"
          done
      - name: Hand on to the next run at ten to the hour
        if: always()
        run: |
          sleep $(( 3000 - $(date +%s) % 3600 > 0 ? 3000 - $(date +%s) % 3600 : 0 ))
          gh workflow run wire.yml --ref main
