name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hourly:
        description: "Started by wire.yml every half hour: the 外電 are stamped with that half hour"
        required: false
        default: "false"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # to restart wire.yml's relay

concurrency:
  group: pages
  cancel-in-progress: true  # a push cancels a deploy still running: the newest content wins, and a hung Pages deploy (2026-11-04, 30+ min) cannot block the night's pushes

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Mend the wire relay if it has dropped (wire.yml)
        # The relay hands itself on with one API call at :50; if that call fails, only its cron (hours late on
        # 2026-11-07) would restart it. Every deploy — the hourly one included — checks for a live run and starts one
        # when there is none, so the hours (and whatever rides on them) are never more than a deploy away.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          alive=0
          for st in in_progress queued waiting requested pending; do
            n=$(gh run list --workflow wire.yml --status "$st" --json databaseId --jq length 2>/dev/null) || n=1
            case "$n" in ''|*[!0-9]*) n=1 ;; esac
            alive=$(( alive + n ))
          done
          if [ "$alive" = 0 ]; then gh workflow run wire.yml --ref main && echo "wire relay restarted"; else echo "wire relay alive ($alive run(s))"; fi
      # always build the newest main, so an older run finishing late cannot replace a newer deploy
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check the app's scripts
        # The one check here that stops a deploy. On 2026-11-11 a patch script left assets/app.js at 0 bytes in the
        # working tree; pushed, it would have gone out and the app would have opened to a blank page. An empty script, or
        # one node reports a SyntaxError in, fails the run before anything is built, and the site keeps its last good
        # deploy. Only that stops it: a node that is missing or fails some other way is a warning, and the deploy goes on.
        # The app's files are modules, so each is checked under an .mjs name; sw.js is checked as the plain script it is.
        run: |
          for f in sw.js assets/*.js; do
            [ -s "$f" ] || { echo "::error::$f 是空檔，這次不部署（線上維持上一版）"; exit 1; }
            case "$f" in sw.js) c="$f" ;; *) c="$RUNNER_TEMP/check.mjs"; cp "$f" "$c" ;; esac
            E=$(node --check "$c" 2>&1) || case "$E" in
              *SyntaxError*) echo "$E"; echo "::error::$f 語法有錯，這次不部署（線上維持上一版）"; exit 1 ;;
              *) echo "::warning::node --check 沒辦法檢查 $f：$E" ;;
            esac
          done
      - name: Build issue index
        run: python3 scripts/build_index.py
      - name: Write calendar files (加入行事曆)
        run: python3 scripts/build_ics.py ics
      - name: Validate today's issue and config.json (report only)
        # neither can stop a deploy: the newest content always goes out, and the problem is shown in the run's log —
        # a config.json inconsistency (a supplement retired but still in the rotation, a new column never scheduled,
        # a mistyped code) is what every night shift's plan_day.py stops on, so it is an error, not a warning
        run: |
          D=$(TZ=Asia/Taipei date +%F)
          python3 scripts/validate.py "$D" || echo "::warning::validate.py reported problems for $D"
          python3 scripts/validate.py --config || echo "::error::config.json 設定不一致（scripts/validate.py --config）"
          # the writers' one-line copy of the lessons must carry every lesson the audit added to the full file
          python3 scripts/lessons.py check || echo "::warning::editorial/LESSONS-short.md 和 LESSONS.md 的條目不一致（scripts/lessons.py check）"
      - name: Wire (外電)
        # wire.yml starts this workflow every half hour for the wires. content/wire.json is not in the repository: each
        # build fetches the four wires afresh (no AI), starting from the live file so a wire that cannot be read this
        # time keeps the items it gave last time. Nothing here can stop a deploy.
        run: |
          curl -sf -A "robin-morning/1.0" --max-time 20 https://wiener-morgen-private.duckdns.org/content/wire.json -o content/wire.json || rm -f content/wire.json
          python3 -m venv /tmp/wire && /tmp/wire/bin/pip install -q opencc-python-reimplemented==0.1.7 || echo "::warning::opencc not installed; DW stays in simplified wording"
          PY=/tmp/wire/bin/python; [ -x "$PY" ] || PY=python3   # the system python only when the venv itself failed, not on wire.py's own exit 1
          WIRE_ON_THE_HOUR="${{ github.event.inputs.hourly }}" "$PY" scripts/wire.py || echo "::warning::wire.py produced nothing this time"
      - name: Football's last file, from the cache (足球)
        # content/football.json carries football.py's translations, what they have cost this credit cycle and the failed
        # tries; a deploy commits nothing, so it goes from one deploy to the next through the Actions cache (every run
        # saves its own copy below; this takes the newest). The live file is fetched only when there is no copy that reads.
        continue-on-error: true
        timeout-minutes: 1   # a stuck download (actions/cache waits 10 min by default) must not hold the 07:12/07:22 deploys
        uses: actions/cache/restore@v6
        with:
          path: content/football.json
          key: football-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: football-
      - name: Football (足球)
        # content/football.json (scripts/football.py; the owner, 2026-11-26: 足球 beside 外電 in the opened strip) is not in
        # the repository either. The cache's copy is the one to start from; without one that reads, the live file, fetched
        # with retries: 200 ok, 404 missing, anything else error (nothing is translated then: the script could not tell
        # what was already done or spent). Claude translates only on the half-hourly deploys (FOOTBALL_TRANSLATE), so
        # only those install the SDK; any other deploy with a good copy sends it out as it is, without reading the feeds.
        # Nothing here can stop a deploy.
        continue-on-error: true
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_TRANSLATE: ${{ github.event.inputs.hourly == 'true' && '1' || '' }}
        run: |
          PY=/tmp/wire/bin/python; [ -x "$PY" ] || PY=python3
          if [ -s content/football.json ] && "$PY" -c 'import json, sys; d = json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(not (isinstance(d, dict) and isinstance(d.get("items", []), list)))' content/football.json 2>/dev/null; then
            export FOOTBALL_PREV=ok
            echo "football.json: the cache's copy"
          else
            if [ -e content/football.json ]; then echo "football.json: the cache's copy does not read"; fi
            rm -f content/football.json
            code=$(curl -s --retry 3 --retry-all-errors -A "robin-morning/1.0" --max-time 20 -o content/football.json -w '%{http_code}' "https://wiener-morgen-private.duckdns.org/content/football.json?t=$(date +%s)") || code=000
            case "$code" in
              200) export FOOTBALL_PREV=ok ;;
              404) export FOOTBALL_PREV=missing; rm -f content/football.json ;;
              *) export FOOTBALL_PREV=error; rm -f content/football.json ;;
            esac
            echo "football.json on the site: HTTP $code ($FOOTBALL_PREV)"
          fi
          if [ "$FOOTBALL_TRANSLATE" != 1 ] && [ "$FOOTBALL_PREV" = ok ]; then
            echo "not a half-hourly deploy: football.json goes out as it is"
          else
            if [ "$FOOTBALL_TRANSLATE" = 1 ]; then timeout 45 "$PY" -m pip install -q anthropic==2.14.0 || echo "::warning::anthropic 沒裝成，這次不翻"; fi
            timeout 150 "$PY" scripts/football.py || echo "::warning::football.py 失敗或逾時（部署照常）"
          fi
          rm -f content/football.json.tmp
      - name: Football's file, into the cache
        if: hashFiles('content/football.json') != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@v6
        with:
          path: content/football.json
          key: football-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Outdoor (出門前)
        # content/outdoor.json — Taichung's air, weather warnings and closures (scripts/outdoor.py, no AI, no key) — is
        # not in the repository either: each build reads the agencies' files afresh, starting from the live file so a
        # source that cannot be read this time keeps what it gave last time, and the script says so in a ::warning:: of
        # its own. It stops itself after about 90 s, and timeout makes sure of it (a file half written when it is cut
        # off is left behind as .tmp: removed so it is not deployed). Nothing here can stop a deploy.
        continue-on-error: true
        run: |
          curl -sf -A "robin-morning/1.0" --max-time 20 https://wiener-morgen-private.duckdns.org/content/outdoor.json -o content/outdoor.json || rm -f content/outdoor.json
          timeout 120 python3 scripts/outdoor.py || echo "::warning::outdoor.py 失敗或逾時"
          rm -f content/outdoor.json.tmp
      - name: Market (市場)
        # content/market.json is not in the repository either: each build reads the figures afresh (no AI, under a
        # minute), starting from the live file so a source that cannot be read this time keeps its last figure
        # (marked stale) and the rate is asked only once its next update is due. Nothing here can stop a deploy.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl -sf -A "robin-morning/1.0" --max-time 20 https://wiener-morgen-private.duckdns.org/content/market.json -o content/market.json || rm -f content/market.json
          python3 scripts/market.py || echo "::warning::market.py stopped with an error or read nothing (see above); the deploy goes on"
      - name: Assemble site
        run: |
          mkdir _site
          cp -R index.html sw.js manifest.webmanifest .nojekyll assets content oauth ics iphone _site/
          git rev-parse HEAD > _site/content/version.txt   # watch.yml compares this with main
      - name: Version the app shell
        # One hash of the shell names the service worker's cache and is appended to every module URL, so a browser
        # never pairs files from two deploys (see the script's docstring).
        run: python3 scripts/version_shell.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
