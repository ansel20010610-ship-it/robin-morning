name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      # always build the newest main, so an older run finishing late cannot replace a newer deploy
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Build issue index
        run: python3 scripts/build_index.py
      - name: Validate today's issue (report only)
        run: |
          D=$(TZ=Asia/Taipei date +%F)
          python3 scripts/validate.py "$D" || echo "::warning::validate.py reported problems for $D"
      - name: Assemble site
        run: |
          mkdir _site
          cp -R index.html sw.js manifest.webmanifest .nojekyll assets content oauth _site/
          git rev-parse HEAD > _site/content/version.txt   # watch.yml compares this with main
      - name: Version the service worker
        # Cache name = hash of the app shell, so sw.js (and the cached shell) changes only when the shell does.
        run: |
          H=$(cat _site/index.html _site/manifest.webmanifest _site/assets/* | sha256sum | cut -c1-12)
          sed -i "s/__SHELL_HASH__/$H/" _site/sw.js
          grep -q "\"robin-shell-$H\"" _site/sw.js || { echo "::error::sw.js has no __SHELL_HASH__ placeholder"; exit 1; }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
