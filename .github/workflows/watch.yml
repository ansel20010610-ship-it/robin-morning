name: Issue watch

# 07:45 Taiwan time: check that today's issue is complete. If not, open (or update) a GitHub issue,
# which GitHub emails to the repository owner.
on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check today's issue
        id: check
        run: |
          D=$(TZ=Asia/Taipei date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          python3 scripts/plan_day.py --date "$D" > plan.txt 2>&1 || true
          V=0; python3 scripts/validate.py "$D" > validate.txt 2>&1 || V=$?
          # the live site must be serving the newest commit (a failed or late deploy leaves readers on old content)
          LIVE=$(curl -fsS "https://wiener-morgen-private.duckdns.org/content/version.txt?t=$(date +%s)" 2>/dev/null || echo "（無法讀取）")
          HEAD=$(git rev-parse HEAD)
          MISSING=$(grep '^缺稿：' plan.txt | sed 's/^缺稿：//' || true)
          # every shift leaves a record in state/runs/<date>.json; a shift that ran but could not push leaves none
          NOREPORT=$(python3 -c "import json,sys; d=json.load(open('state/runs/$D.json')) if __import__('os').path.exists('state/runs/$D.json') else {}; print('、'.join('第 %s 班' % g for g in '12345' if g not in d))")
          {
            echo "台灣時間 07:45 檢查 $D 的刊期。"
            echo
            echo '### 出刊狀態'
            echo '```'
            cat plan.txt
            echo '```'
            echo
            echo '### 驗證結果'
            echo '```'
            cat validate.txt
            echo '```'
            echo
            echo "### 班次回報"
            if [ -n "$NOREPORT" ]; then echo "沒有回報：$NOREPORT（可能沒執行完、或推送被拒；到 https://claude.ai/code/routines 看該班的執行紀錄）"; else echo "第 1–5 班都已回報。"; fi
            [ -f "state/runs/$D.json" ] && { echo '```'; cat "state/runs/$D.json"; echo '```'; }
            echo
            echo "### 線上版本"
            echo "網站：$LIVE"
            echo "main：$HEAD"
            echo
            echo "排程執行紀錄：https://claude.ai/code/routines"
          } > report.md
          if [ -n "$MISSING" ] || [ "$V" -ne 0 ] || [ "$LIVE" != "$HEAD" ] || [ -n "$NOREPORT" ]; then echo "problem=yes" >> "$GITHUB_OUTPUT"; fi
          cat report.md
      - name: Open or update an issue
        if: always() && steps.check.outputs.problem == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="出刊異常：${{ steps.check.outputs.date }}"
          N=$(gh issue list --state open --search "in:title $T" --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body-file report.md; else gh issue create --title "$T" --body-file report.md; fi
